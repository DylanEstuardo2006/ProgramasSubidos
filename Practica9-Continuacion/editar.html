<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Header -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Dummy JSON - Editar</span>
            <a href="../index.html" class="btn btn-outline-light">Inicio</a>
        </div>
    </nav>

    <!-- Main -->
    <main class="container py-5">

        <div class="card shadow">
            <div class="card-body">

                <h1 class="text-center mb-4">Editar Producto</h1>

                <form>

                    <div class="mb-3">
                        <label class="form-label">Nombre del Producto:</label>
                        <input type="text" class="form-control" id="titulo" placeholder="Ej. iPhone 15">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Precio ($):</label>
                        <input type="number" class="form-control" id="precio" placeholder="0.00">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Categoría:</label>
                        <select class="form-select" id="categoria">
                        
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Descripción:</label>
                        <textarea class="form-control" id="descripcion" rows="4" placeholder="Detalles del producto..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">URL imagen (opcional):</label>
                        <input type="text" class="form-control" id="imagen" placeholder="https://...">
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                            ⬅ Volver
                        </button>

                        <button type="button" class="btn btn-primary" onclick="editarProducto()">
                            Guardar Cambios
                        </button>
                    </div>

                </form>

                <div id="mensaje-exito" class="mt-3"></div>

            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3">
        <div class="container">
            <p class="mb-0">&copy; 2026 Prácticas AWOS. Curso de Aplicaciones Web Orientadas a Servicios.</p>
        </div>
    </footer>

    <script src="editar.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
