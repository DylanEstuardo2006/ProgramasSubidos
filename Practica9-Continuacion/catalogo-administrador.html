<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo Administrador</title>
  
    <link rel="stylesheet" href="style.css"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header class="p-3 text-bg-dark"> 
        <div class="container"> 
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> 
                <a href="/" style= "display: block" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"> 
              </a> 
              <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Catalogo Administrador</a>
                </li> 
                 <li>
                    <a href="#" class="nav-link px-2 text-secondary">Home</a>
                </li> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Contactanos</a>
                </li> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Quienes somos</a>
                </li> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Información</a>
                </li> 
               </ul>  
               <div class="text-end"> 
               <select class="form-select" id="buscador-categorias" aria-label="Default select example">
               <option selected>Categorias</option>
               </select>
               </div>
            </div> 
            
        </div> 
    </header>
    <main >
<table class="table">
  <thead class="table-light">
    <tr>
      <th>Nombre Producto</th>
      <th>Precio</th>
      <th>Categoria</th>
      <th>Descripcion</th>
      <th>Imagen</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody id="table-container"></tbody>
</table>
        <aside id ="aside-container-products">
            <div id="products-container" class="container-products"> 
            </div>
        </aside>
    </main>
    <div class="modal fade" id="modalEliminar">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        ¿Seguro que quieres eliminar este producto?
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">
          Cancelar
        </button>
        <button class="btn btn-danger" id="confirmarEliminar">
          Eliminar
        </button>
      </div>

    </div>
  </div>
</div>
    <script src="main-table.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
