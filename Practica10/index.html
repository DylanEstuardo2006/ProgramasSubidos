<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheCockTailDB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<style>
 body {
  background: #f4f6f9;
  color: #212529;
}

/* Cards limpias */
.card {
  background: #ffffff;
  border: none;
  border-radius: 12px;
  transition: all 0.3s ease;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
}

.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
}

/* Imagen */
.card img {
  height: 220px;
  object-fit: cover;
}

/* Botón dorado suave */
.btn-warning {
  background: #c9a227;
  border: none;
  font-weight: 600;
}

.btn-warning:hover {
  background: #a8841f;
}

</style>
<body>
    <header class="p-3 text-bg-dark"> 
        <div class="container"> 
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start"> 
                <a href="/" style= "display: block" class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none"> 
              </a> 
              <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"> 
                <li>
                    <a href="#" class="nav-link px-2 text-secondary">Home</a>
                </li> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Contactanos</a>
                </li> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Quienes somos</a>
                </li> 
                <li>
                    <a href="#" class="nav-link px-2 text-white">Información</a>
                </li> 
               </ul> 
               <div class="text-end"> 
                <button type="button" class="btn btn-outline-light me-2">Login</button> 
                <button type="button" class="btn btn-warning">Sign-up</button> 
               </div> 
            </div> 
        </div> 
    </header>
    <main>
  <div class="container my-4">

    <!-- Filtros -->
    <div class="row mb-4 align-items-center">
      <div class="col-md-6">
        <input type="text" id="buscador" class="form-control" placeholder="Buscar cóctel...">
      </div>
      <div class="col-md-4">
        <select id="categoria" class="form-select">
          <option value="0">Todas las categorías</option>
        </select>
      </div>
    </div>

    <!-- Grid -->
    <div class="row" id="cocktailContainer">  
   
    </div>
         
  </div>
</main>
      <script src="main.js"></script>
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
